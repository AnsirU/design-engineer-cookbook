name: Materialize case study showcase deck v6.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize canonical HTML when payload exists
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="case study showcase deck/.deck-v62-payload.b64"
          OUTPUT="case study showcase deck/case-study-showcase-deck.html"
          WORKFLOW=".github/workflows/materialize-case-study-showcase-deck-v62.yml"
          if [ ! -f "$PAYLOAD" ]; then
            echo "Payload not present yet; waiting for next push."
            exit 0
          fi
          base64 -d "$PAYLOAD" | gzip -d > "$OUTPUT"
          rm "$PAYLOAD"
          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT" "$PAYLOAD" "$WORKFLOW"
          git commit -m "Update case study showcase deck v6.2 style audit"
          git push
