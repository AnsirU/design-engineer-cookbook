name: Finalize case study deck ElevenLabs style audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final source-token corrections
        shell: bash
        run: |
          set -euo pipefail
          FILE="case study showcase deck/case-study-showcase-deck.html"
          WORKFLOW=".github/workflows/finalize-case-study-deck-style.yml"
          python - <<'PY'
          from pathlib import Path
          import re, json

          p = Path("case study showcase deck/case-study-showcase-deck.html")
          t = p.read_text(encoding="utf-8")

          t = t.replace("--graphite:#777169;", "--graphite:#44403b;", 1)
          t = t.replace("font-weight:500;color:var(--smoke);z-index:4}", "font-weight:500;color:var(--graphite);z-index:4}", 1)
          t = t.replace(".pill.dark{background:#000;color:var(--egg);", ".pill.dark{background:#000;color:#fff;", 1)
          t = t.replace(
              "radial-gradient(circle at 28% 64%,#ff8a42 0 18%,transparent 38%),radial-gradient(circle at 68% 34%,#583cff 0 24%,transparent 45%),",
              "radial-gradient(circle at 28% 64%,var(--orange) 0 18%,transparent 38%),radial-gradient(circle at 68% 34%,var(--violet) 0 24%,transparent 45%),",
              1,
          )
          t = t.replace(
              "Eggshell #fdfcfc, Warm Taupe #f5f3f1, Stone #ebe8e4,\n   black UI,",
              "Eggshell #fdfcfc, Warm Taupe #f5f3f1, Stone #ebe8e4,\n   Graphite #44403b, Smoke #777169, Ash #a59f97, black UI,",
              1,
          )

          m = re.search(r'<script id="deck-system-manifest" type="application/json">(\{.*?\})</script>', t, re.S)
          if not m:
              m = re.search(r'<script type="application/json" id="deck-system-manifest">(\{.*?\})</script>', t, re.S)
          if not m:
              raise SystemExit("deck-system-manifest not found")

          manifest = json.loads(m.group(1))
          manifest["artifact"]["version"] = "v6.2-elevenlabs-style-audited-final"
          audit = manifest["style_source_audit"]
          tokens = audit["source_tokens_preserved"]
          tokens["strong_secondary_text"] = "#44403b"
          tokens["button_text_on_black"] = "#ffffff"
          audit["audit_note"] = (
              "Final source check restored Graphite #44403b for strong secondary labels, "
              "uses exact Violet #0447ff and Orange #ff4704 anchors inside product visuals, "
              "and keeps pure white only as text/highlight where the source explicitly uses it—not as a slide surface."
          )
          new_manifest = json.dumps(manifest, ensure_ascii=False, indent=2)
          t = t[:m.start(1)] + new_manifest + t[m.end(1):]
          p.write_text(t, encoding="utf-8")
          PY
          rm "$WORKFLOW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize ElevenLabs tokens for case study showcase deck"
          git push
