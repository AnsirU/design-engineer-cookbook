name: Materialize case study showcase deck

on:
  push:
    paths:
      - ".github/workflows/materialize-case-study-showcase-deck.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode canonical HTML template
        shell: bash
        run: |
          mkdir -p "case study showcase deck"
          cat .tmp-case-study-deck/chunk-* | base64 -d | gzip -d > "case study showcase deck/case-study-showcase-deck.html"
          test -s "case study showcase deck/case-study-showcase-deck.html"
          grep -q 'id="deck-system-manifest"' "case study showcase deck/case-study-showcase-deck.html"
          grep -q 'data-slide-type="cover"' "case study showcase deck/case-study-showcase-deck.html"
      - name: Commit canonical template and clean temporary payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "case study showcase deck/case-study-showcase-deck.html"
          git rm -r .tmp-case-study-deck
          git rm ".github/workflows/materialize-case-study-showcase-deck.yml"
          git commit -m "Add agent-readable case study showcase deck"
          git push
